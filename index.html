<!DOCTYPE html>
    <head>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f9f9f9;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .container {
                text-align: center;
                background: #fff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                width: 300px;
            }
            h1 {
                font-size: 24px;
                color: #333;
            }
            .input-group {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 100%;
            }
            .input-container {
                position: relative;
                width: 100%;
            }
            input {
                width: 80%;
                padding: 10px;
                font-size: 16px;
                border: 1px solid #ccc;
                border-radius: 4px;
                padding-right: 40px;
            }
            button {
                background: transparent;
                border: none;
                cursor: pointer;
                position: absolute;
                right: 35px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 18px;
                padding: 0;
            }
            button:focus {
                outline: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Enter Password</h1>
            <form id="passwordForm">
                <div class="input-group">
                    <div class="input-container">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password" 
                        />
                        <button
                            type="button"
                            id="toggleVisibility"
                            aria-label="Show Password"
                        ></button>
                    </div>
                </div>
            </form>
        </div>
        <script>
            const inp = document.getElementById("Password");
            const btn = document.getElementById("toggleVisibility");
            if (inp && btn) {
                btn.addEventListener("click", () => {
                    if (inp.type === "password") {
                        inp.type = "text";
                        btn.textContent = "Shown";
                    }
                    else {
                            inp.type = "password";
                            btn.textContent = "Hidden";
                        }
                });
            }
        </script>
    </body>
</html>
